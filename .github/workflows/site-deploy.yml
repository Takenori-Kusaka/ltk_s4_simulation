# ARCHIVED: LTK Season 4 終了に伴い本ワークフローは停止・アーカイブ化されました。
# 自動実行(push / cron)は停止しています。

name: site-deploy

on:
  workflow_dispatch:
    inputs:
      collect:
        description: Riot API からソロランクを収集する
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: site-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stack

      - name: data/raw を前回の実行から持ち越す
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: ltk-raw-${{ github.run_id }}
          restore-keys: ltk-raw-

      - name: ソロランクを収集する
        id: collect
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect) || hashFiles('data/raw/players/*.json') == ''
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          rm -f data/raw/collect.lock
          node src/collect/cli.ts

      - name: data/raw を次の実行へ残す
        if: steps.collect.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: ltk-raw-${{ github.run_id }}

      - name: 集計する
        run: |
          set +e
          node src/collect/aggregate-cli.ts | tee aggregate.log
          code=${PIPESTATUS[0]}
          set -e
          { echo '## 集計'; echo; echo '```'; tail -n 40 aggregate.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # 1 = 一部の失敗(書ける集計は書いた)。2・3 = 公開用の評価を書かない検証の違反
          if [ "$code" -ge 2 ]; then exit "$code"; fi

      - name: ビルドする
        run: npm run build

      - name: gh-pages へ公開する
        run: |
          sha=$(git rev-parse --short HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add pages origin/gh-pages
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. pages/
          touch pages/.nojekyll
          cd pages
          git add -A
          if git diff --cached --quiet; then echo '変更なし'; exit 0; fi
          git commit -m "deploy: main ${sha} (${{ github.event_name }})"
          git push origin HEAD:gh-pages
